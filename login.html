<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Book Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px var(--shadow-color);
      position: relative;
      overflow: hidden;
    }

    .auth-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .auth-box:hover::before {
      opacity: 1;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .auth-logo p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .auth-tabs {
      display: flex;
      gap: 16px;
      margin-bottom: 32px;
      border-bottom: 2px solid var(--border-color);
    }

    .auth-tab {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--text-secondary);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      position: relative;
    }

    .auth-tab.active {
      color: var(--accent-primary);
    }

    .auth-tab.active::after {
      content: "";
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 100%;
      height: 2px;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-secondary));
    }

    .auth-form {
      display: none;
    }

    .auth-form.active {
      display: block;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      transition: all 0.3s;
    }

    body.light-mode .form-group input {
      background: rgba(255, 255, 255, 0.6);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .auth-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .auth-button:active {
      transform: translateY(0);
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .auth-footer {
      margin-top: 24px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 13px;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .theme-toggle-login {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
    }

    .theme-toggle-login:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 4px 16px var(--shadow-color);
    }

    /* Mobile Responsiveness */
    @media (max-width: 768px) {
      .auth-container {
        padding: 16px;
      }

      .auth-box {
        padding: 32px 24px;
        border-radius: 20px;
      }

      .auth-logo h1 {
        font-size: 28px;
      }

      .auth-logo p {
        font-size: 13px;
      }

      .auth-tabs {
        gap: 12px;
      }

      .auth-tab {
        font-size: 15px;
        padding: 10px;
      }

      .form-group label {
        font-size: 13px;
      }

      .form-group input {
        padding: 12px 14px;
        font-size: 14px;
      }

      .auth-button {
        padding: 12px;
        font-size: 15px;
      }

      .theme-toggle-login {
        top: 16px;
        right: 16px;
        width: 40px;
        height: 40px;
        font-size: 18px;
      }

      .error-message,
      .success-message {
        font-size: 13px;
        padding: 10px;
      }

      .auth-footer {
        font-size: 12px;
        margin-top: 20px;
      }
    }

    @media (max-width: 480px) {
      .auth-box {
        padding: 28px 20px;
      }

      .auth-logo h1 {
        font-size: 24px;
      }

      .form-group input {
        font-size: 16px; /* Prevents zoom on iOS */
      }
    }
  </style>
</head>
<body>
  <button class="theme-toggle-login" id="theme-toggle-login" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>📚 Book Tracker</h1>
        <p>Track your reading journey</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" onclick="switchTab('login')">Login</button>
        <button class="auth-tab" onclick="switchTab('register')">Register</button>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      
      <form id="login-form" class="auth-form active" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label for="login-email">Email</label>
          <input type="email" id="login-email" required placeholder="anthony@example.com">
        </div>
        <div class="form-group">
          <label for="login-password">Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <div style="text-align: right; margin-bottom: 16px;">
          <a href="forgot-password.html" style="color: var(--accent-primary); text-decoration: none; font-size: 14px; font-weight: 500;">Forgot Password?</a>
        </div>
        <button type="submit" class="auth-button" id="login-btn">
          Login
        </button>
      </form>

      
      <form id="register-form" class="auth-form" onsubmit="handleRegister(event)">
        <div class="form-group">
          <label for="register-username">Username</label>
          <input type="text" id="register-username" required placeholder="John Doe">
        </div>
        <div class="form-group">
          <label for="register-email">Email</label>
          <input type="email" id="register-email" required placeholder="john@example.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <input type="password" id="register-password" required placeholder="••••••••" minlength="6">
        </div>
        <div class="form-group">
          <label for="register-goal">Yearly Reading Goal</label>
          <input type="number" id="register-goal" required placeholder="50" min="1" value="50">
        </div>
        <button type="submit" class="auth-button" id="register-btn">
          Create Account
        </button>
      </form>

      <div class="auth-footer">
        <p>Your reading data is securely stored 🔒</p>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // Theme toggle
    function initTheme() {
      const savedTheme = localStorage.getItem('bookTrackerTheme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
      }
      updateThemeIcon();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
      localStorage.setItem('bookTrackerTheme', currentTheme);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const themeToggle = document.getElementById('theme-toggle-login');
      if (themeToggle) {
        themeToggle.textContent = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
      }
    }

    // Tab switching
    function switchTab(tab) {
      const tabs = document.querySelectorAll('.auth-tab');
      const forms = document.querySelectorAll('.auth-form');
      
      tabs.forEach(t => t.classList.remove('active'));
      forms.forEach(f => f.classList.remove('active'));
      
      if (tab === 'login') {
        tabs[0].classList.add('active');
        document.getElementById('login-form').classList.add('active');
      } else {
        tabs[1].classList.add('active');
        document.getElementById('register-form').classList.add('active');
      }

      hideMessages();
    }

    // Message display
    function showError(message) {
      const errorEl = document.getElementById('error-message');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const successEl = document.getElementById('success-message');
      successEl.innerHTML = message;
      successEl.classList.add('show');
    }

    function hideMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    // Resend verification email
    async function resendVerification(email) {
      try {
        const response = await fetch('http://localhost:9000/api/auth/resend-verification', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to resend verification email');
        }

        showSuccess('Verification email sent! Please check your inbox.');
      } catch (error) {
        showError(error.message || 'Failed to resend verification email.');
      }
    }

    // Login handler
    async function handleLogin(event) {
      event.preventDefault();
      hideMessages();

      const email = document.getElementById('login-email').value;
      const password = document.getElementById('login-password').value;
      const btn = document.getElementById('login-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Logging in...';

      try {
        const response = await api.login(email, password);
        showSuccess('Login successful! Redirecting...');
        setTimeout(() => {
          window.location.href = 'index.html';
        }, 1000);
      } catch (error) {
        // Check if it's a verification error
        if (error.message && error.message.includes('verify your email')) {
          const errorMsg = error.message +
            '<br><br><a href="#" onclick="resendVerification(\'' + email + '\'); return false;" style="color: var(--accent-primary); text-decoration: underline;">Click here to resend verification email</a>';
          document.getElementById('error-message').innerHTML = errorMsg;
          document.getElementById('error-message').classList.add('show');
        } else {
          showError(error.message || 'Login failed. Please check your credentials.');
        }
        btn.disabled = false;
        btn.textContent = 'Login';
      }
    }

    // Register handler
    async function handleRegister(event) {
      event.preventDefault();
      hideMessages();

      const username = document.getElementById('register-username').value;
      const email = document.getElementById('register-email').value;
      const password = document.getElementById('register-password').value;
      const yearlyGoal = parseInt(document.getElementById('register-goal').value);
      const btn = document.getElementById('register-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Creating account...';

      try {
        const response = await fetch('http://localhost:9000/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ username, email, password, yearlyGoal })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Registration failed');
        }

        // Show success message with verification instructions
        const successMsg = data.message +
          '<br><br><a href="#" onclick="resendVerification(\'' + email + '\'); return false;" style="color: #22c55e; text-decoration: underline;">Didn\'t receive the email? Click here to resend</a>';
        document.getElementById('success-message').innerHTML = successMsg;
        document.getElementById('success-message').classList.add('show');

        // Switch to login tab after a delay
        setTimeout(() => {
          switchTab('login');
          document.getElementById('login-email').value = email;
        }, 3000);

        btn.disabled = false;
        btn.textContent = 'Create Account';
      } catch (error) {
        showError(error.message || 'Registration failed. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Create Account';
      }
    }

    // Check if already logged in
    function checkAuth() {
      if (api.isAuthenticated()) {
        window.location.href = 'index.html';
      }
    }

    // Check if user was redirected after email verification
    function checkVerificationStatus() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('verified') === 'true') {
        showSuccess('✅ Email verified successfully! You can now login.');
        // Remove the query parameter from URL
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    }

    // Initialize
    initTheme();
    checkAuth();
    checkVerificationStatus();
  </script>
</body>
</html>
