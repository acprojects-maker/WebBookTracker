<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - Book Tracker</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-container {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .auth-box {
      background: var(--card-bg);
      backdrop-filter: blur(20px) saturate(180%);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 48px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 20px 60px var(--shadow-color);
      position: relative;
      overflow: hidden;
    }

    .auth-box::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.1), rgba(168, 85, 247, 0.1));
      opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .auth-box:hover::before {
      opacity: 1;
    }

    .auth-logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .auth-logo h1 {
      font-size: 36px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .auth-logo p {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-primary);
      font-weight: 500;
      font-size: 14px;
    }

    .form-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      color: var(--text-primary);
      font-size: 15px;
      transition: all 0.3s;
    }

    body.light-mode .form-group input {
      background: rgba(255, 255, 255, 0.6);
    }

    .form-group input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.1);
    }

    .auth-button {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, var(--accent-primary), var(--accent-secondary));
      border: none;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 8px;
    }

    .auth-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.4);
    }

    .auth-button:active {
      transform: translateY(0);
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-message {
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #ef4444;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .error-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    .success-message {
      background: rgba(34, 197, 94, 0.1);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #22c55e;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 14px;
      display: none;
    }

    .success-message.show {
      display: block;
      animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .back-link {
      text-align: center;
      margin-top: 24px;
    }

    .back-link a {
      color: var(--accent-primary);
      text-decoration: none;
      font-size: 14px;
      font-weight: 500;
      transition: opacity 0.3s;
    }

    .back-link a:hover {
      opacity: 0.8;
    }

    .loading {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .theme-toggle-login {
      position: absolute;
      top: 20px;
      right: 20px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 20px;
      transition: all 0.3s;
    }

    .theme-toggle-login:hover {
      transform: scale(1.1) rotate(15deg);
      box-shadow: 0 4px 16px var(--shadow-color);
    }

    .info-box {
      background: rgba(59, 130, 246, 0.1);
      border: 1px solid rgba(59, 130, 246, 0.3);
      color: var(--text-primary);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 24px;
      font-size: 14px;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <button class="theme-toggle-login" id="theme-toggle-login" onclick="toggleTheme()" aria-label="Toggle theme">☀️</button>

  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-logo">
        <h1>🔑 Forgot Password</h1>
        <p>Enter your email to reset your password</p>
      </div>

      <div id="error-message" class="error-message"></div>
      <div id="success-message" class="success-message"></div>

      <div class="info-box">
        Enter your email address and we'll send you a link to reset your password.
      </div>

      <form id="forgot-password-form" onsubmit="handleForgotPassword(event)">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required placeholder="your@email.com">
        </div>

        <button type="submit" class="auth-button" id="submit-btn">
          Send Reset Link
        </button>
      </form>

      <div class="back-link">
        <a href="login.html">← Back to Login</a>
      </div>
    </div>
  </div>

  <script src="config.js"></script>
  <script src="api.js"></script>
  <script>
    // Theme toggle
    function initTheme() {
      const savedTheme = localStorage.getItem('bookTrackerTheme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
      }
      updateThemeIcon();
    }

    function toggleTheme() {
      document.body.classList.toggle('light-mode');
      const currentTheme = document.body.classList.contains('light-mode') ? 'light' : 'dark';
      localStorage.setItem('bookTrackerTheme', currentTheme);
      updateThemeIcon();
    }

    function updateThemeIcon() {
      const themeToggle = document.getElementById('theme-toggle-login');
      if (themeToggle) {
        themeToggle.textContent = document.body.classList.contains('light-mode') ? '🌙' : '☀️';
      }
    }

    // Message display
    function showError(message) {
      const errorEl = document.getElementById('error-message');
      errorEl.textContent = message;
      errorEl.classList.add('show');
      setTimeout(() => errorEl.classList.remove('show'), 5000);
    }

    function showSuccess(message) {
      const successEl = document.getElementById('success-message');
      successEl.textContent = message;
      successEl.classList.add('show');
    }

    function hideMessages() {
      document.getElementById('error-message').classList.remove('show');
      document.getElementById('success-message').classList.remove('show');
    }

    // Forgot password handler
    async function handleForgotPassword(event) {
      event.preventDefault();
      hideMessages();

      const email = document.getElementById('email').value;
      const btn = document.getElementById('submit-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="loading"></span> Sending...';

      try {
        const response = await fetch('http://localhost:9000/api/auth/forgot-password', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ email })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || 'Failed to send reset link');
        }

        showSuccess(data.message);
        document.getElementById('forgot-password-form').reset();

        // If in development, show the reset token
        if (data.resetToken) {
          console.log('🔑 Development Mode - Reset Token:', data.resetToken);
          console.log('🔗 Reset Link:', `http://localhost:5500/reset-password.html?token=${data.resetToken}`);
        }

        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      } catch (error) {
        showError(error.message || 'Failed to send reset link. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    }

    // Initialize
    initTheme();
  </script>
</body>
</html>
